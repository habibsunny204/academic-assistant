# DIU Academic Assistant — evaluation question set
#
# HOW TO USE
#   python cli.py eval-check                      # validate against the index
#   python cli.py evaluate --retrieval-only       # retrieval + relevance floor, no LLM
#   python cli.py evaluate                        # full run (needs GROQ_API_KEY)
#   python cli.py calibrate --file eval/questions.yaml   # tune the floor on the dev split
#
# FIELDS
#   id, split (dev|test), type (answerable|unanswerable), question
#   gold_docs        substrings of the filename(s) that contain the answer
#   evidence         exact text the right passage must contain (whitespace and case
#                    are ignored). Empty = any passage from a gold document counts.
#   answer_facts     every fact the answer must state; each is a list of acceptable
#                    forms. Times, dates, ordinals, punctuation and citation markers
#                    are normalised before matching.
#   reference_answer what a correct answer says, for the report and for reviewers
#   difficulty       lookup | paraphrase | multi-part | adversarial | near-domain | off-topic
#   reviewed         set to true once a person has checked the item against the source
#
# SPLITS
#   dev  is for tuning (e.g. `calibrate`). Report results on test only: numbers
#   measured on the questions used for tuning overstate how well the system works.
#
# PROVENANCE OF THE GOLD ANSWERS
#   Class routine facts were cross-checked against the PDF with pdfplumber, a
#   different parser from the PyMuPDF pipeline that produced the index (room,
#   course, section, teacher, weekday and time slot by column position: 18/18
#   confirmed). Notice facts were read from the scanned image, not from OCR text.
#   Form facts are the DOCX text. They are still marked reviewed: false until a
#   person at DIU has checked them.
#
# EXTENDING
#   Add questions whenever documents are added. `python cli.py eval-feedback`
#   turns answers rated in the web UI into draft items to complete here.

version: 1
